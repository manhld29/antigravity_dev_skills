# Devcycle Phase-3 code-quality config — flake8 / pycodestyle / isort.
# Copy to the target app's repo root (merge if a setup.cfg already exists).
# pylint is configured separately in .pylintrc; black in pyproject.toml.
# All tools share line length = 100 so they never contradict each other.

[flake8]
max-line-length = 100
max-complexity = 10
# E203/W503 conflict with black's slicing/line-break style; E501 is covered above.
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .venv,
    venv,
    graphify-out
# Tests may use slightly looser rules (long fixtures, asserts).
per-file-ignores =
    tests/*: S101

[pycodestyle]
max-line-length = 100
exclude = .git,__pycache__,build,dist,.venv,venv,graphify-out

[isort]
profile = black
line_length = 100
known_first_party =
multi_line_output = 3
include_trailing_comma = true
skip = .venv,venv,build,dist,graphify-out
